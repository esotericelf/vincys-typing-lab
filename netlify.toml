# Static site — no build. Connect this GitHub repo in Netlify and set publish directory to `.`
[build]
  publish = "."
  command = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/dict/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
